<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member login | Syrian Taste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="index.html"><span>ST</span> Syrian Taste</a>
      <nav aria-label="Main navigation">
        <a href="index.html#story">we are taste</a
        ><a href="index.html#menu">Menu</a><a href="contact.html">Visit us</a>
      </nav>
      <a class="header-action" href="contact.html#booking"
        >Book a table <span></span
      ></a>
    </header>
    <section class="login page-intro">
      <p class="ll">Welcome back</p>
      <h1>Your table<br /><em>awaits.</em></h1>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Your password"
          required
        />

        <button class="button button-dark" type="submit">
          Sign in <span></span>
        </button>
      </form>

      <p id="loginMessage"></p>
    </section>

    <footer class="site-footer">
      <div>
        <a class="brand" href="index.html"><span>ST</span> Syrian Taste</a>
        <p>A modern Syrian table<br />in the heart of of algiers</p>
      </div>
      <div class="footer-bottom">
        <span>© 2026 Syrian Taste</span
        ><a href="index.html">Back home <span></span></a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
